<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiosqui — Batch C · Admin, Pauta, Actividad, Encuesta, Invitar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#e8e3da}
  [data-theme="dark"] img.kq-logo-light{content:url("assets/logo-cream-transparent.png")}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="batch_b/ProfileScreen.jsx"></script>
<script type="text/babel" src="batch_b/SupportScreens.jsx"></script>
<script type="text/babel" src="batch_c/AdminScreen.jsx"></script>
<script type="text/babel" src="batch_c/EngagementScreens.jsx"></script>
<script type="text/babel" src="batch_c/PautaInviteV2.jsx"></script>
<script type="text/babel">
function DarkC({children}) {
  return <div data-theme="dark" style={{width:"100%", height:"100%"}}>{children}</div>;
}
function App() {
  return (
    <DesignCanvas>
      <DCSection id="admin" title="Admin — /admin" subtitle="Layout propio: sidebar navy de administración + stats con delta + cola de moderación con acciones aprobar/rechazar/ver.">
        <DCArtboard id="admin-light" label="Admin · resumen + moderación" width={1440} height={820}><AdminScreen/></DCArtboard>
        <DCArtboard id="admin-dark" label="Admin · dark" width={1440} height={820}><DarkC><AdminScreen/></DarkC></DCArtboard>
      </DCSection>
      <DCSection id="pauta" title="Pauta — /pauta (modelo saldo + campaña, estilo FB Ads)" subtitle="Recarga de saldo (tarjeta) + campaña: objetivo (impresiones/mensajes) · monto con estimado en vivo · segmentación por ubicación (departamento/municipio) y edad + fechas. Mapea a los campos reales targetCitId/targetTowId/targetAgeMin/targetAgeMax de PautaMain.tsx.">
        <DCArtboard id="pauta-light" label="Pauta · constructor de campaña" width={1440} height={1180}><PautaScreen/></DCArtboard>
        <DCArtboard id="pauta-dark" label="Pauta · dark" width={1440} height={1180}><DarkC><PautaScreen/></DarkC></DCArtboard>
      </DCSection>
      <DCSection id="engagement" title="Actividad · Encuesta · Invitar" subtitle="Activity = feed de notificaciones agrupado por día. Survey = una pregunta con barra de progreso + escala. Invite = referidos Q50 (ambos ganan, al hacer el invitado su primera compra de pauta).">
        <DCArtboard id="activity" label="Actividad" width={1440} height={760}><ActivityScreen/></DCArtboard>
        <DCArtboard id="survey" label="Encuesta" width={1440} height={680}><SurveyScreen/></DCArtboard>
        <DCArtboard id="invite" label="Invitar amigos (Q50)" width={1440} height={900}><InviteScreen/></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
