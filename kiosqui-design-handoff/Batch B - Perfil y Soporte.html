<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiosqui — Batch B · Perfil, Contacto, FAQ, Soporte y Legales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#e8e3da}
  [data-theme="dark"] img.kq-logo-light{content:url("assets/logo-cream-transparent.png")}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="batch_b/ProfileScreen.jsx"></script>
<script type="text/babel" src="batch_b/SupportScreens.jsx"></script>
<script type="text/babel">
function DarkB({children}) {
  return <div data-theme="dark" style={{width:"100%", height:"100%"}}>{children}</div>;
}
function App() {
  return (
    <DesignCanvas>
      <DCSection id="profile" title="Perfil público de vendedor — /creator-profile" subtitle="Banda navy + card de identidad superpuesta: avatar, insignia DPI, stats, CTA mensaje. Tabs con subrayado verde.">
        <DCArtboard id="profile-light" label="Perfil de vendedor" width={1440} height={1020}><ProfileScreen/></DCArtboard>
        <DCArtboard id="profile-dark" label="Perfil · dark" width={1440} height={1020}><DarkB><ProfileScreen/></DarkB></DCArtboard>
      </DCSection>
      <DCSection id="content" title="Páginas de contenido — /contact · /faq · /soporte" subtitle="Patrón compartido: cabecera centrada con overline lavanda + cuerpo según función.">
        <DCArtboard id="contact" label="Contacto" width={1440} height={980}><ContactScreen/></DCArtboard>
        <DCArtboard id="faq" label="FAQ" width={1440} height={1060}><FaqScreen/></DCArtboard>
        <DCArtboard id="soporte" label="Soporte" width={1440} height={980}><SoporteScreen/></DCArtboard>
      </DCSection>
      <DCSection id="legal" title="Legales — /terminos · /privacidad" subtitle="Plantilla tipográfica: TOC sticky a la izquierda, prosa 16/1.7, callouts lavanda. El mismo layout sirve para ambas rutas.">
        <DCArtboard id="legal-light" label="Términos y condiciones" width={1440} height={980}><LegalScreen/></DCArtboard>
        <DCArtboard id="legal-dark" label="Legales · dark" width={1440} height={980}><DarkB><LegalScreen/></DarkB></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
