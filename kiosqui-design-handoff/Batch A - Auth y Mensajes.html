<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiosqui — Batch A · Auth y Mensajes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#e8e3da}
  /* swap del logo del header de mensajes en artboards dark */
  [data-theme="dark"] img.kq-logo-light{content:url("assets/logo-cream-transparent.png")}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="batch_a/AuthScreens.jsx"></script>
<script type="text/babel" src="batch_a/MessagesScreen.jsx"></script>
<script type="text/babel" src="batch_a/MessagesMobile.jsx"></script>
<script type="text/babel">
function Dark({children}) {
  return <div data-theme="dark" style={{width:"100%", height:"100%"}}>{children}</div>;
}
function App() {
  return (
    <DesignCanvas>
      <DCSection id="auth" title="Auth — login · registro · recuperar · verificar" subtitle="Panel de marca navy (halos lavanda/verde) + formulario sobre cream. Botón acción verde, focus lavanda.">
        <DCArtboard id="login" label="Login" width={1440} height={900}><LoginScreen/></DCArtboard>
        <DCArtboard id="register" label="Registro" width={1440} height={900}><RegisterScreen/></DCArtboard>
        <DCArtboard id="forgot" label="Recuperar contraseña" width={1440} height={900}><ForgotScreen/></DCArtboard>
        <DCArtboard id="verify" label="Verificación de correo" width={1440} height={900}><VerifyScreen/></DCArtboard>
        <DCArtboard id="login-dark" label="Login · dark" width={1440} height={900}><Dark><LoginScreen/></Dark></DCArtboard>
      </DCSection>
      <DCSection id="messages" title="Mensajes — /messages" subtitle="HeaderTwo compact (sin buscador) + lista de conversaciones + hilo con contexto de la propiedad y acceso al modelo 3D.">
        <DCArtboard id="msgs" label="Mensajes" width={1440} height={900}><MessagesScreen/></DCArtboard>
        <DCArtboard id="msgs-dark" label="Mensajes · dark" width={1440} height={900}><Dark><MessagesScreen/></Dark></DCArtboard>
      </DCSection>
      <DCSection id="messages-mobile" title="Mensajes mobile — patrón lista → hilo (Batch A.1)" subtitle="Una vista a la vez: la bandeja ocupa toda la pantalla; al tocar una conversación se navega al hilo con botón volver, contexto de propiedad compacto (lavanda) y botón 3D.">
        <DCArtboard id="m-inbox" label="Mobile · bandeja" width={390} height={844}><MessagesMobileInbox/></DCArtboard>
        <DCArtboard id="m-thread" label="Mobile · hilo" width={390} height={844}><MessagesMobileThread/></DCArtboard>
        <DCArtboard id="m-thread-dark" label="Mobile · hilo · dark" width={390} height={844}><Dark><MessagesMobileThread/></Dark></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
